<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>跑馬仔電子計分板 (P2P)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #f5f5f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hidden { display: none !important; }

    /* 設定開局介面 (iPad / iPhone 通用) */
    #setup-view { background: #1c1c1e; padding: 24px; border-radius: 16px; width: 92%; max-width: 440px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .setup-title { text-align: center; margin-bottom: 20px; font-size: 22px; font-weight: bold; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; color: #8e8e93; margin-bottom: 8px; }
    .name-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .name-inputs input { width: 100%; min-width: 0; max-width: 100%; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
    .name-inputs input:focus { border-color: #007aff; }
    .mode-select { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mode-btn { min-width: 0; width: 100%; overflow-wrap: anywhere; padding: 12px; background: #2c2c2e; border: 2px solid #3a3a3c; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .mode-btn.active { border-color: #34c759; background: #1e3a24; color: #30d158; }
    .btn-start { width: 100%; padding: 15px; background: #34c759; color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; margin-top: 10px; cursor: pointer; }

    /* iPad 看板介面 */
    #ipad-view { width: 96vw; height: 96vh; display: flex; flex-direction: column; padding: 10px; }
    .board-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #1c1c1e; border-radius: 14px; margin-bottom: 12px; }
    .grid-container { display: grid; gap: 14px; flex: 1; }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-5 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 100px; }
    
    .player-card { background: #1c1c1e; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #2c2c2e; }
    .player-name { font-size: 28px; color: #98989d; margin-bottom: 8px; font-weight: 600; }
    .player-score { font-size: 60px; font-weight: bold; }
    .score-pos { color: #30d158; }
    .score-neg { color: #ff453a; }
    .score-zero { color: #8e8e93; }

    /* 抽水箱卡片 */
    .pot-card { grid-column: 1 / span 2; background: #241d08; border: 2px solid #ffd60a; flex-direction: row; justify-content: space-around; padding: 10px 20px; border-radius: 16px; align-items: center; }
    .pot-title { font-size: 24px; color: #ffd60a; font-weight: bold; }
    .pot-amount { font-size: 44px; font-weight: bold; color: #ffd60a; }

    /* 連線 QR Code 遮罩 */
    #qr-modal { position: absolute; background: rgba(0,0,0,0.88); top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99; }
    #qrcode { background: white; padding: 16px; border-radius: 14px; margin-bottom: 15px; }

    /* iPhone 控制端 */
    #iphone-view { width: 100%; max-width: 440px; padding: 16px; }
    .ctrl-box { background: #1c1c1e; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .ctrl-title { font-size: 13px; color: #8e8e93; margin-bottom: 10px; font-weight: 600; }
    .btn-group { display: grid; gap: 8px; }
    .grid-4-btn { grid-template-columns: repeat(4, 1fr); }
    .opt-btn { background: #2c2c2e; color: #fff; border: 2px solid transparent; padding: 14px 4px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt-btn.active { border-color: #ff9f0a; background: #3a2e18; color: #ff9f0a; }

    /* 動作類型按鈕 */
    .action-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .act-btn { padding: 14px 6px; background: #2c2c2e; border: 2px solid transparent; color: #fff; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .act-btn.active { background: #007aff; border-color: #007aff; }

    .counter-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; }
    .counter-btn { width: 48px; height: 48px; background: #2c2c2e; border: none; border-radius: 8px; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; }
    .counter-display { font-size: 24px; font-weight: bold; color: #ffd60a; }

    .submit-btn { width: 100%; padding: 16px; background: #34c759; color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; }
    .reset-btn { width: 100%; padding: 12px; background: transparent; color: #ff453a; font-size: 14px; font-weight: bold; border: none; margin-top: 5px; cursor: pointer; }
    body {justify-content:flex-start;min-height:100dvh;}
    #setup-view {margin:24px auto;width:calc(100% - 24px);max-width:440px;min-width:0;padding:20px;align-self:center;}
    #setup-view .name-inputs input {min-height:48px;}
    #setup-view .mode-btn {min-height:54px;line-height:1.4;}
    #setup-view .btn-start {white-space:normal;line-height:1.4;padding:15px 10px;}
    @media(max-width:360px) {#setup-view {padding:16px;}.setup-title {font-size:21px;}}
    #iphone-view {max-width:720px;min-height:100dvh;padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));}
    .ctrl-box {padding:12px;margin-bottom:10px;}
    .ctrl-title {font-size:15px;color:#b5b5bb;}
    .grid-4-btn {grid-template-columns:repeat(2,minmax(0,1fr));}
    .opt-btn,.act-btn {min-height:58px;font-size:19px;white-space:normal;overflow-wrap:anywhere;touch-action:manipulation;}
    .action-selector {grid-template-columns:repeat(3,minmax(0,1fr));}
    .action-selector .act-btn:first-child {grid-column:span 2;}
    .horses {grid-template-columns:repeat(3,1fr);}
    .kong-switch {display:flex;align-items:center;gap:12px;font-size:21px;min-height:48px;}
    .kong-switch input {width:30px;height:30px;accent-color:#34c759;}
    .hint {font-size:14px;color:#aaa;margin-top:6px;}
    button:disabled {opacity:.4;cursor:default;}
    .submit-btn {min-height:64px;position:sticky;bottom:env(safe-area-inset-bottom,0);box-shadow:0 0 18px #121212;}
    #settlement {line-height:1.6;color:#ffd60a;}
    #feedback {min-height:24px;color:#ff9f0a;}
    #ipad-view {height:100dvh;}
    #qr-modal {position:fixed;min-height:100dvh;overflow:auto;}
    .board-header {flex-wrap:wrap;gap:10px;padding-right:100px;}
    dialog::backdrop {background:rgba(0,0,0,.75);}
    #iphone-view>div:first-child {min-height:52px;display:flex;align-items:center;justify-content:center;padding:52px 0 0;font-size:13px!important;}
    #player-buttons .opt-btn,#payer-buttons .opt-btn {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:80px;padding:10px 6px;}
    .pick-score {font-size:25px;font-variant-numeric:tabular-nums;}
    .submit-btn {position:static;}
    /* 按 Safari 實際可用高度調整，保留所有結算控制 */
    #iphone-view {min-height:100dvh;padding:calc(54px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));}
    #iphone-view>div:first-child {padding:0;min-height:20px;margin-bottom:6px!important;}
    #iphone-view .ctrl-box {padding:8px;margin-bottom:6px;}
    #iphone-view .ctrl-title {font-size:12px;line-height:1.3;margin-bottom:5px;}
    #iphone-view .btn-group,#iphone-view .action-selector {gap:6px;}
    #iphone-view .action-selector {grid-template-columns:repeat(5,minmax(0,1fr));}
    #iphone-view .action-selector .act-btn:first-child {grid-column:auto;}
    #iphone-view .act-btn {min-height:44px;padding:8px 2px;font-size:16px;}
    #player-buttons .opt-btn {min-height:clamp(54px,9dvh,82px);padding:6px 4px;font-size:18px;gap:2px;}
    #payer-buttons {grid-template-columns:repeat(4,minmax(0,1fr));}
    #payer-buttons .opt-btn {min-height:50px;padding:6px 2px;font-size:15px;gap:2px;}
    #iphone-view .pick-score {font-size:21px;}
    #payer-buttons .pick-score {font-size:17px;}
    #iphone-view .horses {grid-template-columns:repeat(6,minmax(0,1fr));}
    #horse-buttons .opt-btn {min-height:44px;font-size:16px;padding:6px 1px;}
    #iphone-view .kong-switch {min-height:36px;font-size:17px;}
    #iphone-view .kong-switch input {width:26px;height:26px;}
    #kong-box .hint {display:none;}
    #iphone-view #settlement {font-size:12px;line-height:1.4;}
    #feedback {min-height:0;font-size:13px;line-height:1.4;}
    #feedback:empty {display:none;}
    #iphone-view .submit-btn {min-height:48px;padding:10px;margin-top:4px;font-size:18px;}
    @media(max-height:700px) {
      #iphone-view .ctrl-box {padding:6px;margin-bottom:4px;}
      #player-buttons .opt-btn {min-height:44px;flex-direction:row;gap:8px;font-size:16px;}
      #payer-buttons .opt-btn {min-height:44px;}
      #iphone-view .pick-score {font-size:17px;}
      #iphone-view .act-btn {font-size:14px;}
    }
    @media(max-height:620px) {
      #iphone-view>.ctrl-box:has(.action-selector)>.ctrl-title {display:none;}
      #iphone-view #settlement {padding:4px;font-size:11px;}
    }
    @media(orientation:landscape) and (max-height:500px) {
      #iphone-view {max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 10px;align-content:start;}
      #iphone-view>div:first-child,#iphone-view .submit-btn,#feedback {grid-column:1/-1;}
    }
  </style>
</head>
<body>
  <div id="mode-view" class="ctrl-box" style="width:92%;max-width:520px;margin:24px auto"><h1 style="font-size:25px;margin-bottom:16px">🀄 跑馬仔計分</h1><p style="margin-bottom:16px;color:#aaa">揀今次點樣使用</p><button class="btn-start" onclick="chooseMode(false)">iPad 睇分</button><button class="btn-start" onclick="chooseMode(true)">iPhone 計分+睇分</button></div>
  <button id="results-btn" class="opt-btn hidden" onclick="showResults()" style="position:fixed;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:110;min-height:44px;font-size:16px;padding:8px 12px">顯示結果</button>
  <dialog id="results-menu" aria-labelledby="results-title" style="margin:auto;background:#1c1c1e;color:white;border:1px solid #555;border-radius:16px;padding:20px;width:min(92vw,480px);max-height:90dvh;overflow:auto"><h2 id="results-title" style="margin-bottom:16px">目前結果</h2><div id="results-players" class="btn-group grid-4-btn" aria-live="polite"></div><div class="ctrl-box" style="margin-top:12px;background:#241d08;color:#ffd60a"><div>抽水箱</div><div id="results-pot" style="font-size:30px;font-weight:bold"></div></div><p id="results-status" class="hint"></p><button class="btn-start" onclick="document.getElementById('results-menu').close()">返回計分</button></dialog>
  <button id="options-btn" class="opt-btn hidden" aria-label="開啟選項" onclick="openOptions()" style="position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:110;min-height:44px;font-size:16px;padding:8px 12px">☰ 選項</button>
  <dialog id="options-menu" style="margin:auto;background:#1c1c1e;color:white;border:1px solid #555;border-radius:16px;padding:22px;width:min(92vw,440px);max-height:90dvh;overflow:auto"><h2>選項</h2><button class="opt-btn" style="width:100%;margin-top:12px" onclick="document.getElementById('options-menu').close();resetGame()">設定玩家名稱／玩法</button><button class="reset-btn" onclick="zeroScores()" style="min-height:60px;font-size:19px">將計分重設至 0</button><p class="hint">四位玩家分數同抽水箱歸零，保留玩家名稱及玩法。</p><button class="opt-btn" style="width:100%;margin-top:16px" onclick="document.getElementById('options-menu').close()">返回</button><details style="margin-top:20px"><summary style="font-size:20px;padding:12px 0;cursor:pointer">自訂計分選項</summary><p class="hint">每家／單一付款者嘅金額如下。只影響之後嘅結算。</p><div id="rule-fields"></div><button id="save-rules" class="btn-start" onclick="saveRules()">儲存計分設定</button></details><p id="option-feedback" role="status"></p></dialog>


  <!-- 1. 開局設定介面 -->
  <div id="setup-view" class="hidden">
    <div class="setup-title">🀄️ 跑馬仔設定</div>
    
    <div class="form-group">
      <label>玩法版本</label>
      <div class="mode-select">
        <button type="button" class="mode-btn active" id="btn-mode-rake" onclick="toggleRake(true)">抽水版 (中馬抽$10)</button>
        <button type="button" class="mode-btn" id="btn-mode-norake" onclick="toggleRake(false)">不抽水版</button>
      </div>
    </div>

    <div class="form-group">
      <label>自訂玩家名稱 (東南西北)</label>
      <div class="name-inputs">
        <input type="text" id="p-name-0" placeholder="東家" value="東家">
        <input type="text" id="p-name-1" placeholder="南家" value="南家">
        <input type="text" id="p-name-2" placeholder="西家" value="西家">
        <input type="text" id="p-name-3" placeholder="北家" value="北家">
      </div>
    </div>

    <button type="button" class="btn-start" id="start-btn" onclick="handleStart()">確定開局</button>
  </div>

  <!-- 2. iPad 顯示看板 -->
  <div id="ipad-view" class="hidden">
    <div class="board-header">
      <h2 id="board-mode-tag">跑馬仔計分板</h2><button class="opt-btn" onclick="document.getElementById('qr-modal').classList.remove('hidden')">連線 QR Code</button>
      <div id="conn-status" style="color: #ff9f0a; font-size: 15px;">等待 iPhone 掃碼連線...</div>
    </div>

    <div id="board-grid" class="grid-container grid-4">
      <div class="player-card"><div class="player-name" id="disp-name-0">東家</div><div id="score-0" class="player-score score-zero">0</div></div>
      <div class="player-card"><div class="player-name" id="disp-name-1">南家</div><div id="score-1" class="player-score score-zero">0</div></div>
      <div class="player-card"><div class="player-name" id="disp-name-2">西家</div><div id="score-2" class="player-score score-zero">0</div></div>
      <div class="player-card"><div class="player-name" id="disp-name-3">北家</div><div id="score-3" class="player-score score-zero">0</div></div>
      
      <!-- 抽水箱 -->
      <div id="pot-card" class="player-card pot-card hidden">
        <div class="pot-title">💰 抽水箱</div>
        <div id="pot-score" class="pot-amount">$0</div>
      </div>
    </div>

    <!-- QR Code 遮罩 -->
    <div id="qr-modal">
      <div id="qrcode"></div><a id="join-link" style="color:white;word-break:break-all;padding:20px"></a><button class="opt-btn" onclick="document.getElementById('qr-modal').classList.add('hidden')">返回計分板</button>
      <p style="font-size: 18px; font-weight: 500;">請用 iPhone 相機掃碼控制</p>
    </div>
  </div>

  <!-- 3. iPhone 控制端 -->
  <div id="iphone-view" class="hidden">
    <div style="text-align: center; margin-bottom: 12px; font-size: 14px; color: #30d158; font-weight: bold;">
      <span id="phone-status">連線中…</span> · <span id="phone-mode-text">抽水版</span>
    </div>

    <div class="ctrl-box">
      <div class="ctrl-title">結算動作</div>
      <div class="action-selector">
        <button type="button" class="act-btn active" id="act-win" onclick="setAction('win')">自摸</button>
        <button type="button" class="act-btn" id="act-ming" onclick="setAction('ming')">明槓</button>
        <button type="button" class="act-btn" id="act-an" onclick="setAction('an')">暗槓</button>
      <button type="button" class="act-btn" id="act-bu" onclick="setAction('bu')">補槓</button><button type="button" class="act-btn" id="act-rob" onclick="setAction('rob')">搶槓</button></div>
    </div>

    <div class="ctrl-box">
      <div class="ctrl-title" id="player-pick-label">自摸玩家</div>
      <div class="btn-group grid-4-btn" id="player-buttons"></div>
    </div>

    <div class="ctrl-box hidden" id="payer-box"><div class="ctrl-title" id="payer-label">被槓玩家</div><div class="btn-group grid-4-btn" id="payer-buttons"></div></div>
    <div class="ctrl-box hidden" id="kong-box"><label class="kong-switch"><input type="checkbox" id="kong-win" onchange="renderControls()"> 槓上自摸</label><p class="hint">槓錢＋普通自摸，冇額外獎金</p></div>
    <div class="ctrl-box" id="horse-box"><div class="ctrl-title">中馬隻數（每馬每家 $20；抽水版每馬抽 $10）</div><div class="btn-group horses" id="horse-buttons"></div></div>
    <div id="settlement" class="ctrl-box" aria-live="polite">請選擇玩家</div>
    <p id="feedback" role="status"></p>
    <button type="button" class="submit-btn" onclick="submitAction()">確認送出更新</button>
    
  </div>

<script>
'use strict';
const $=id=>document.getElementById(id), KEY='mahjong-v2';
const RULES={win:20,horse:20,rake:10,ming:30,an:20,bu:10,rob:60,robHorse:60};
let soloMode=false;
let peer,conn,hostPeerId=new URLSearchParams(location.search).get('join'),isPhoneRole=!!hostPeerId;
let state={version:2,revision:0,game:crypto.randomUUID(),isRake:true,names:['東家','南家','西家','北家'],scores:[0,0,0,0],pot:0,seen:[]};
let currentAction='win',selectedPlayer=null,payer=null,horseCount=0,ready=false,pending=null,lastReply=Date.now(),retryAt=0;
const clients=new Set();
function validState(s){return s&&s.version===2&&typeof s.game==='string'&&Number.isSafeInteger(s.revision)&&typeof s.isRake==='boolean'&&Array.isArray(s.names)&&s.names.length===4&&s.names.every(n=>typeof n==='string'&&n.length<=40)&&Array.isArray(s.scores)&&s.scores.length===4&&s.scores.every(Number.isSafeInteger)&&Number.isSafeInteger(s.pot)&&Array.isArray(s.seen);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('conn-status').textContent='儲存空間不足，請保持計分板開啟';}}
function send(c,d){if(c?.open)c.send(d);}
function broadcast(){persist();renderBoard();clients.forEach(c=>send(c,{type:'STATE',state}));}
function calculate(s,a){
 const rules={...RULES,...s.rules};
 if(!['win','ming','an','bu','rob'].includes(a.action)||!Number.isInteger(a.player)||a.player<0||a.player>3||!Number.isInteger(a.horses)||a.horses<0||a.horses>5||typeof a.kongWin!=='boolean')throw Error('結算資料有誤');
 const single=['ming','rob'].includes(a.action);
 if(single&&(!Number.isInteger(a.payer)||a.payer<0||a.payer>3||a.payer===a.player))throw Error('請揀另一位付款玩家');
 const delta=[0,0,0,0];let pot=0;
 const pay=(i,v)=>{delta[i]-=v;delta[a.player]+=v;};
 const all=v=>{for(let i=0;i<4;i++)if(i!==a.player)pay(i,v);};
 if(a.action==='ming')pay(a.payer,rules.ming);
 if(a.action==='an')all(rules.an);
 if(a.action==='bu')all(rules.bu);
 if(a.action==='rob')pay(a.payer,rules.rob+a.horses*rules.robHorse);
 const win=a.action==='win'||(['ming','an','bu'].includes(a.action)&&a.kongWin);
 if(win)all(rules.win+a.horses*rules.horse);
 if((win||a.action==='rob')&&s.isRake){pot=a.horses*rules.rake;delta[a.player]-=pot;}
 return {delta,pot};
}
function toggleRake(v){$('btn-mode-rake').classList.toggle('active',v);$('btn-mode-norake').classList.toggle('active',!v);$('setup-view').dataset.rake=String(v);}
function settings(){return {names:[0,1,2,3].map(i=>$('p-name-'+i).value.trim().slice(0,40)||['東家','南家','西家','北家'][i]),isRake:$('setup-view').dataset.rake!=='false'};}
function handleStart(){const config=settings();if(soloMode){Object.assign(state,config);state.revision++;persist();ready=true;$('setup-view').classList.add('hidden');$('iphone-view').classList.remove('hidden');$('options-btn').classList.remove('hidden');status('● 本機計分');renderControls();return;}if(isPhoneRole){submitCommand({kind:'settings',config});}else{Object.assign(state,config);state.revision++;persist();$('setup-view').classList.add('hidden');$('ipad-view').classList.remove('hidden');$('options-btn').classList.remove('hidden');renderBoard();initPeer();}}
function renderBoard(){ $('board-mode-tag').textContent='跑馬仔計分板 · '+(state.isRake?'抽水版':'不抽水版');$('board-grid').className='grid-container '+(state.isRake?'grid-5':'grid-4');$('pot-card').classList.toggle('hidden',!state.isRake);$('pot-score').textContent='$'+state.pot;state.names.forEach((n,i)=>{$('disp-name-'+i).textContent=n;const el=$('score-'+i),v=state.scores[i];el.textContent=(v>0?'+':'')+v;el.className='player-score '+(v>0?'score-pos':v<0?'score-neg':'score-zero');});}
function resetGame(){state.names.forEach((n,i)=>$('p-name-'+i).value=n);toggleRake(state.isRake);$('iphone-view').classList.add('hidden');$('setup-view').classList.remove('hidden');}
function setAction(a){currentAction=a;selectedPlayer=payer=null;horseCount=0;$('kong-win').checked=false;renderControls();}
function renderControls(){
 $('results-btn').classList.remove('hidden');if($('results-menu').open)renderResults();
 $('phone-mode-text').textContent=state.isRake?'抽水版':'不抽水版';
 document.querySelectorAll('.act-btn').forEach(b=>{b.classList.toggle('active',b.id==='act-'+currentAction);b.setAttribute('aria-pressed',String(b.id==='act-'+currentAction));});
 $('player-pick-label').textContent={win:'自摸玩家',ming:'明槓玩家',an:'暗槓玩家',bu:'補槓玩家',rob:'搶槓者'}[currentAction];
 const single=['ming','rob'].includes(currentAction),kong=['ming','an','bu'].includes(currentAction);
 $('payer-box').classList.toggle('hidden',!single);$('payer-label').textContent=currentAction==='rob'?'被搶者（包晒）':'被槓玩家（付 $30）';$('kong-box').classList.toggle('hidden',!kong);
 const rules={...RULES,...state.rules};$('payer-label').textContent=currentAction==='rob'?'被搶者（包晒）':'被槓玩家（付 $'+rules.ming+'）';$('horse-box').querySelector('.ctrl-title').textContent='中馬隻數';
 const hasHorse=['win','rob'].includes(currentAction)||(kong&&$('kong-win').checked);$('horse-box').classList.toggle('hidden',!hasHorse);
 function picks(id,selected,callback){$(id).replaceChildren();state.names.forEach((n,i)=>{let b=document.createElement('button');b.type='button';const label=document.createElement('span');label.textContent=n;const score=document.createElement('span');const v=state.scores[i];score.textContent=(v<0?'−':v>0?'+':'')+'$'+Math.abs(v);score.className='pick-score '+(v>0?'score-pos':v<0?'score-neg':'score-zero');b.append(label,score);b.className='opt-btn'+(selected===i?' active':'');b.setAttribute('aria-pressed',String(selected===i));b.disabled=id==='payer-buttons'&&i===selectedPlayer;b.onclick=()=>{callback(i);renderControls();};$(id).append(b);});}
 picks('player-buttons',selectedPlayer,i=>{selectedPlayer=i;if(payer===i)payer=null;});picks('payer-buttons',payer,i=>payer=i);
 $('horse-buttons').replaceChildren();for(let i=0;i<=5;i++){let b=document.createElement('button');b.type='button';b.textContent=i+' 隻';b.className='opt-btn'+(horseCount===i?' active':'');b.setAttribute('aria-pressed',String(horseCount===i));b.onclick=()=>{horseCount=i;renderControls();};$('horse-buttons').append(b);}
 try{const r=calculate(state,selection());$('settlement').textContent=state.names.map((n,i)=>n+' '+(r.delta[i]>=0?'+':'')+'$'+r.delta[i]).join(' ／ ')+'；抽水 +$'+r.pot;}catch(e){$('settlement').textContent=single?'請揀收款同付款玩家':'請揀玩家';}
 document.querySelector('.submit-btn').disabled=!ready||!!pending||selectedPlayer===null||(single&&payer===null);
}
function selection(){return {action:currentAction,player:selectedPlayer,payer,horses:horseCount,kongWin:$('kong-win').checked};}
function submitAction(){try{calculate(state,selection());submitCommand({kind:'action',...selection()});}catch(e){$('feedback').textContent=e.message;}}
function submitCommand(data){if(!ready||pending)return;if(soloMode){const m={type:'COMMAND',id:crypto.randomUUID(),game:state.game,revision:state.revision,...data};pending=m;accept({open:true,send:receive},m);return;}$('feedback').textContent='等緊 iPad 確認…';pending={type:'COMMAND',id:crypto.randomUUID(),game:state.game,revision:state.revision,...data};send(conn,pending);renderControls();}
function accept(c,m){
 if(!m||typeof m!=='object')return;
 if(m.type==='PING'){send(c,{type:'PONG'});return;}
 if(m.type==='HELLO'){send(c,{type:'STATE',state});return;}
 if(m.type!=='COMMAND')return;
 if(state.seen.includes(m.id)){send(c,{type:'ACK',id:m.id,state});return;}
 if(typeof m.id!=='string'||m.id.length>100)return;
 if(m.game!==state.game||m.revision!==state.revision){send(c,{type:'REJECT',id:m.id,message:'分數或設定已更新，請核對後再送出',state});return;}
 try{if(m.kind==='rules'){if(!validRules(m.rules))throw Error('計分設定有誤');state.rules=Object.fromEntries(Object.keys(RULES).map(k=>[k,m.rules[k]]));}else if(m.kind==='reset'){state.scores=[0,0,0,0];state.pot=0;}else if(m.kind==='action'){const r=calculate(state,m);state.scores=state.scores.map((v,i)=>v+r.delta[i]);state.pot+=r.pot;}else if(m.kind==='settings'){const q=m.config;if(!q||typeof q.isRake!=='boolean'||!Array.isArray(q.names)||q.names.length!==4||!q.names.every(n=>typeof n==='string'&&n.length>0&&n.length<=40))throw Error('設定有誤');state.names=q.names.slice();state.isRake=q.isRake;}else throw Error('未知指令');state.revision++;state.seen.push(m.id);broadcast();send(c,{type:'ACK',id:m.id,state});}catch(e){send(c,{type:'REJECT',id:m.id,message:e.message,state});}
}
function status(t){$(isPhoneRole||soloMode?'phone-status':'conn-status').textContent=t;}
function receive(m){if(!m||typeof m!=='object')return;lastReply=Date.now();if(['STATE','ACK','REJECT'].includes(m.type)&&validState(m.state)){state=m.state;ready=true;status(soloMode?'● 本機計分':'● 已同步至 iPad');if(m.type==='STATE'&&pending)send(conn,pending);if(pending&&m.id===pending.id){pending=null;$('feedback').textContent=m.type==='ACK'?'已完成 ✓':m.message;$('option-feedback').textContent=m.type==='ACK'?'已完成 ✓':m.message;if(m.type==='ACK'){selectedPlayer=payer=null;horseCount=0;$('kong-win').checked=false;$('setup-view').classList.add('hidden');$('iphone-view').classList.remove('hidden');}}renderControls();}}
function dial(){if(!peer?.open||conn?.open)return;conn?.close();conn=peer.connect(hostPeerId,{reliable:true});conn.on('open',()=>{lastReply=Date.now();send(conn,{type:'HELLO'});});conn.on('data',receive);conn.on('close',()=>{ready=false;status('連線中斷，正在重連…');renderControls();});conn.on('error',()=>{ready=false;status('連線失敗，正在重試…');});}
function initPeer(){if(typeof Peer==='undefined'){status('連線元件載入失敗，請連上網絡後重新整理');return;}let savedId;try{savedId=sessionStorage.getItem('mahjong-host-id');}catch(e){}peer=new Peer(!isPhoneRole&&savedId?savedId:undefined);peer.on('open',id=>{if(isPhoneRole){dial();return;}try{sessionStorage.setItem('mahjong-host-id',id);}catch(e){}const url=new URL(location.href);url.search='';url.searchParams.set('join',id);$('join-link').href=url.href;$('join-link').textContent=url.href;$('qrcode').replaceChildren();if(typeof QRCode!=='undefined')new QRCode($('qrcode'),{text:url.href,width:220,height:220});else status('QR Code 載入失敗，可以用連結連線');});peer.on('connection',c=>{if(isPhoneRole){c.close();return;}clients.add(c);c.on('open',()=>{status('● '+[...clients].filter(x=>x.open).length+' 部控制器已連線');$('qr-modal').classList.add('hidden');send(c,{type:'STATE',state});});c.on('data',m=>accept(c,m));c.on('close',()=>{clients.delete(c);status(clients.size?'● 控制器已連線':'控制器已離線，可重新掃碼');});});peer.on('disconnected',()=>{status('訊號連線中斷，正在重試…');});peer.on('error',e=>{status('連線問題：'+e.type+'；正在重試');if(e.type==='unavailable-id'){try{sessionStorage.removeItem('mahjong-host-id');}catch(x){}peer.destroy();setTimeout(initPeer,2000);}});}
function chooseMode(solo){soloMode=solo;$('mode-view').classList.add('hidden');$('setup-view').classList.remove('hidden');$('start-btn').textContent=solo?'開始 iPhone 計分+睇分':'開啟 iPad 計分板';}
const RULE_LABELS={win:'自摸：每家底數',horse:'自摸：每馬每家',rake:'抽水版：贏家每馬抽水',ming:'明槓：被槓者一人付',an:'暗槓：每家付',bu:'補槓：每家付',rob:'搶槓：被搶者包底數',robHorse:'搶槓：每馬被搶者付'};
function validRules(r){return r&&Object.keys(RULES).every(k=>Number.isSafeInteger(r[k])&&r[k]>=0&&r[k]<=100000)&&r.rake<=Math.min(r.horse*3,r.robHorse);}
function renderResults(){$('results-players').replaceChildren();state.names.forEach((name,i)=>{const card=document.createElement('div');card.className='opt-btn';const label=document.createElement('div');label.textContent=name;const score=document.createElement('div');const v=state.scores[i];score.textContent=(v<0?'−':v>0?'+':'')+'$'+Math.abs(v);score.className=v>0?'score-pos':v<0?'score-neg':'score-zero';score.style.fontSize='30px';card.append(label,score);$('results-players').append(card);});$('results-pot').textContent='$'+state.pot;$('results-status').textContent=soloMode?'本機最新結果':ready?'已同步至 iPad':'連線中斷或同步中，以上係最後收到嘅分數';}
function showResults(){renderResults();$('results-menu').showModal();}
function openOptions(){$('option-feedback').textContent='';$('rule-fields').replaceChildren();Object.keys(RULES).forEach(k=>{const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0';const text=document.createElement('span');text.textContent=RULE_LABELS[k]+' $';const input=document.createElement('input');input.id='rule-'+k;input.type='number';input.min='0';input.max='100000';input.step='1';input.inputMode='numeric';input.value=(state.rules||RULES)[k];input.style.cssText='width:100px;min-height:44px;font-size:18px;background:#303033;color:white;border:1px solid #777;border-radius:8px;padding:8px';label.append(text,input);$('rule-fields').append(label);});$('options-menu').showModal();}
function saveRules(){const rules={};for(const k of Object.keys(RULES)){const value=$('rule-'+k).value;if(value.trim()===''){$('option-feedback').textContent='請填齊所有金額';return;}rules[k]=Number(value);}if(!validRules(rules)){$('option-feedback').textContent='請用 0–100000 整數；每馬抽水唔可以超過每馬總收入';return;}if(isPhoneRole||soloMode){if(!ready||pending){$('option-feedback').textContent='請等同步或上一筆操作完成';return;}submitCommand({kind:'rules',rules});}else{state.rules=rules;state.revision++;broadcast();$('option-feedback').textContent='已儲存計分設定 ✓';}}

function zeroScores(){if((isPhoneRole||soloMode)&&(!ready||pending)){$('option-feedback').textContent='請等連線同步或上一筆操作完成';return;}if(!confirm('確定將四位玩家分數同抽水箱重設至 0？呢個動作無法復原。'))return;if(isPhoneRole||soloMode){submitCommand({kind:'reset'});}else{state.scores=[0,0,0,0];state.pot=0;state.revision++;broadcast();$('option-feedback').textContent='已重設至 0 ✓';}}
window.addEventListener('DOMContentLoaded',()=>{if(isPhoneRole){$('mode-view').classList.add('hidden');$('options-btn').classList.remove('hidden');$('setup-view').classList.add('hidden');$('iphone-view').classList.remove('hidden');renderControls();initPeer();}else{try{const saved=JSON.parse(localStorage.getItem(KEY));if(validState(saved))state=saved;}catch(e){}state.names.forEach((n,i)=>$('p-name-'+i).value=n);toggleRake(state.isRake);$('start-btn').textContent=state.revision?'繼續 iPad 計分板（保留分數）':'開啟 iPad 計分板';}setInterval(()=>{if(!peer)return;if(peer.disconnected&&!peer.destroyed&&Date.now()>retryAt){retryAt=Date.now()+5000;peer.reconnect();}if(isPhoneRole){if(conn?.open){send(conn,{type:'PING'});if(Date.now()-lastReply>15000){ready=false;conn.close();renderControls();}else if(pending)send(conn,pending);}else dial();}},3000);});
window.addEventListener('online',()=>{if(isPhoneRole)dial();else if(peer?.disconnected)peer.reconnect();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isPhoneRole){if(conn?.open)send(conn,{type:'HELLO'});else dial();}});
</script>
</body>
</html>
